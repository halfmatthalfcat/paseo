apiVersion: v1
kind: Pod
metadata:
  name: paseo
  namespace: paseo
  labels:
    app: paseo
spec:
  restartPolicy: Always
  automountServiceAccountToken: false
  imagePullSecrets:
    - name: ghcr-pull
  containers:
    - name: paseo
      image: ghcr.io/halfmatthalfcat/paseo-workspace:latest
      ports:
        - containerPort: 6767
      envFrom:
        - secretRef:
            name: paseo-secrets
      env:
        - name: HOME
          value: /workspace/.home
        - name: CARGO_HOME
          value: /workspace/.cargo
        - name: CARGO_BUILD_JOBS
          value: "4"
        - name: PASEO_HOME
          value: /workspace/.paseo
      volumeMounts:
        - name: workspace
          mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
          ephemeral-storage: 1Gi
        limits:
          cpu: "4"
          memory: 16Gi
          ephemeral-storage: 10Gi
      readinessProbe:
        tcpSocket:
          port: 6767
        initialDelaySeconds: 10
        periodSeconds: 10
      livenessProbe:
        tcpSocket:
          port: 6767
        initialDelaySeconds: 30
        periodSeconds: 30
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: paseo-workspace
