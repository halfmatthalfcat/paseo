name: runner-image
# Build the self-hosted runner image and publish it to ghcr. Runs on a GitHub-hosted runner
# (building a container needs Docker, which the ARC runners don't have) using GITHUB_TOKEN, which
# can create the repo-linked package that an App installation token cannot.
#
# This image executes every job dispatched to whichever ARC scale set consumes it, so it is the
# most privileged artifact this repo produces: its base is digest-pinned in
# .github/runner/Dockerfile, and each push publishes SLSA provenance + an SBOM alongside the
# manifest.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/runner/**"
      - ".github/workflows/runner-image.yml"

permissions: {}

concurrency:
  group: runner-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Pinned rather than `ubuntu-latest`: the image runner-image builds should not change
    # underneath us when GitHub rolls the `latest` label to a new Ubuntu.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # The docker-container driver, which the default docker driver is not: attestations
      # (provenance/SBOM) require it.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .github/runner
          push: true
          # Full SLSA provenance (which commit, which workflow, which base) and an SBOM, so the
          # runner image can be traced back to this repository rather than trusted on faith.
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/halfmatthalfcat/paseo-runner:latest
            ghcr.io/halfmatthalfcat/paseo-runner:${{ github.sha }}
